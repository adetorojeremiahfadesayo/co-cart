[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/realtime-session"
  to = "/.netlify/functions/realtime-session"
  status = 200

[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

  [[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
